name: CI

on:
  push:
    branches: [main, improvement]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        # Non-blocking until the swallowed-error catches are fixed in SEC-002 (Phase 2, step 6 makes it blocking).
        continue-on-error: true
        run: npm run lint
      - run: npm run format:check
